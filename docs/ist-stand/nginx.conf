# Dashboard-Auslieferung. Port 80 = http (Kiosk auf dem Pi, LAN).
# Port 443 = https mit selbstsigniertem Zertifikat (deploy/tls/make-cert.sh) – nötig, damit der
# Browser das Mikrofon für den Sprachassistenten freigibt (getUserMedia braucht einen Secure Context).
# Über https reicht nginx /api/ (REST + WebSocket) an Home Assistant weiter, weil der Browser von einer
# https-Seite kein http/ws zu :8123 zulässt (Mixed Content). Das Frontend nutzt bei https automatisch
# dieselbe Origin als HA-URL (siehe src/ha/useHa.ts, VITE_HA_URL=auto).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri /index.html; }
  location ~* \.(js|css|svg|woff2)$ { expires 7d; add_header Cache-Control "public"; }
}

server {
  listen 443 ssl;
  http2 on;
  ssl_certificate     /etc/nginx/tls/dashboard.crt;
  ssl_certificate_key /etc/nginx/tls/dashboard.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri /index.html; }
  location ~* \.(js|css|svg|woff2)$ { expires 7d; add_header Cache-Control "public"; }

  # Home Assistant (host-network, Port 8123) über die Docker-Bridge-Gateway-IP.
  # Keine X-Forwarded-*-Header setzen: dann verlangt HA keine trusted_proxies-Konfiguration.
  location /api/ {
    proxy_pass http://172.17.0.1:8123;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;   # WebSocket offen halten
    proxy_buffering off;
  }
}
