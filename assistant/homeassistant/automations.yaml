- id: kalender_live_refresh
  alias: 'Kalender live: iCloud abgleichen + Dashboard benachrichtigen'
  description: Holt die iCloud-Kalender (CalDAV) jede Minute statt alle 15 min und
    sofort nach jedem calendar.*-Service (Sprachassistent/Dashboard). Feuert danach
    das Event smarthomeheart_calendar_refreshed, auf das das Dashboard hört.
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: event
    event_type: call_service
    event_data:
      domain: calendar
  - trigger: event
    event_type: call_service
    event_data:
      domain: rest_command
  conditions: []
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.platform == ''event'' }}'
    then:
    - delay:
        seconds: 3
  - action: homeassistant.update_entity
    target:
      entity_id:
      - calendar.hjem
      - calendar.arbeid
  - event: smarthomeheart_calendar_refreshed
    event_data:
      source: '{{ trigger.platform }}'
  mode: queued
  max: 3
