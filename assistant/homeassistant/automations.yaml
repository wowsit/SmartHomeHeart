- id: kalender_live_refresh
  alias: 'Kalender live: iCloud abgleichen + Dashboard benachrichtigen'
  description: Holt die iCloud-Kalender (CalDAV) jede Minute statt alle 15 min, sofort
    nach jedem calendar.*/rest_command.*-Service und nach jeder Sprachassistent-Anfrage
    (conversation.* ändert bei jeder Anfrage seinen Zeitstempel). Feuert danach das
    Event smarthomeheart_calendar_refreshed, auf das das Dashboard hört.
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: event
    event_type: call_service
    event_data:
      domain: calendar
  - trigger: event
    event_type: call_service
    event_data:
      domain: rest_command
  - trigger: state
    entity_id:
    - conversation.claude_conversation
    - conversation.home_assistant
  conditions: []
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.platform in [''event'',''state''] }}'
    then:
    - delay:
        seconds: 3
  - action: homeassistant.update_entity
    target:
      entity_id:
      - calendar.hjem
      - calendar.arbeid
      - calendar.kalender
      - calendar.arbeit
      - calendar.privat
      - calendar.familie
  - event: smarthomeheart_calendar_refreshed
    event_data:
      source: '{{ trigger.platform }}'
  mode: queued
  max: 3
# Esszimmer: Wandschalter (SONOFF ZBMINIL2, switch.esszimmer) und die drei Hue-Lampen
# (Gruppe light.esszimmer_deckenlampe) laufen synchron. [wunsch, 2026-09-05]
# Der ZBMINIL2 versorgt die Lampen mit Strom: Schalter aus -> Lampen "unavailable". Deshalb
# nur echte on<->off-Uebergaenge als Trigger, damit kein Ping-Pong ueber "unavailable" entsteht.
- id: esszimmer_schalter_lampen_sync
  alias: 'Esszimmer: Schalter und Lampen synchron'
  description: Schalter an -> Lampen an (sobald erreichbar). Lampen aus -> Schalter aus. Lampen an -> Schalter an.
  triggers:
  - trigger: state
    entity_id: switch.esszimmer
    from: 'off'
    to: 'on'
    id: schalter_an
  - trigger: state
    entity_id: switch.esszimmer
    from: 'on'
    to: 'off'
    id: schalter_aus
  - trigger: state
    entity_id: light.esszimmer_deckenlampe
    from: 'on'
    to: 'off'
    id: lampen_aus
  - trigger: state
    entity_id: light.esszimmer_deckenlampe
    from: 'off'
    to: 'on'
    id: lampen_an
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: schalter_an
      sequence:
      - wait_template: "{{ states('light.esszimmer_deckenlampe') in ['on', 'off'] }}"
        timeout: '00:00:20'
        continue_on_timeout: true
      - action: light.turn_on
        target:
          entity_id: light.esszimmer_deckenlampe
        continue_on_error: true
    - conditions:
      - condition: trigger
        id: schalter_aus
      - condition: state
        entity_id: light.esszimmer_deckenlampe
        state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.esszimmer_deckenlampe
        continue_on_error: true
    - conditions:
      - condition: trigger
        id: lampen_aus
      - condition: state
        entity_id: switch.esszimmer
        state: 'on'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.esszimmer
    - conditions:
      - condition: trigger
        id: lampen_an
      - condition: state
        entity_id: switch.esszimmer
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.esszimmer
  mode: queued
  max: 5
